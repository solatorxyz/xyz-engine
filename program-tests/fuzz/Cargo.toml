[package]
name = "program-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
[package.metadata]
cargo-fuzz = true
[dependencies]
libfuzzer-sys = "0.4"
litesvm = "0.18"
solana-account = "4.3"
solana-address = "~2.7"
solana-instruction = "~3.5"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-message = "4.2"
solana-clock = "~3.2"
agave-feature-set = "~4.3"
agave-reserved-account-keys = "~4.3"
solana-bpf-loader-program = "~4.3"
solana-builtins = "~4.3"
solana-builtins-default-costs = "~4.3"
solana-compute-budget = "~4.3"
solana-compute-budget-instruction = "~4.3"
solana-compute-budget-program = "~4.3"
solana-fee = "~4.3"
solana-program-runtime = "~4.3"
solana-runtime-transaction = "~4.3"
solana-svm-callback = "~4.3"
solana-svm-feature-set = "~4.3"
solana-svm-log-collector = "~4.3"
solana-svm-measure = "~4.3"
solana-svm-timings = "~4.3"
solana-svm-type-overrides = "~4.3"
solana-syscalls = "~4.3"
solana-system-program = "~4.3"
solana-transaction-context = "~4.3"
solana-vote-program = "~4.3"
solana-zk-elgamal-proof-program = "~4.3"
solana-zk-token-proof-program = "~4.3"
[workspace]
members = ["."]
[[bin]]
name = "program"
path = "fuzz_targets/program.rs"
test = false
doc = false
[profile.release]
debug = 1
